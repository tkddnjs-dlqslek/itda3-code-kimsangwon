<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>소비기한 기한 검증</title>
  <link rel="stylesheet" href="style.css?v=1790837879">
</head>
<body>
  <header>
    <h1>중고거래 기한 검증</h1>
    <nav><a href="/">스캔</a><a href="stock.html">재고와 할인 대상</a><a href="verify.html">기한 검증</a></nav>
  </header>
  <main>
    <section class="card">
      <p class="msg">판매자가 올리는 게시글 사진처럼, 소비기한 표시 부분이 보이는 사진을 포함해 최대 5장을 올리면 남은 기간을 읽어 등록 가능 여부를 판정합니다. 사진은 저장하지 않습니다.</p>
      <label>상품명 (선택)</label><input id="pname" placeholder="예: 비타민C 1000 60정">
      <label>게시글 사진</label><input id="photoFiles" type="file" accept="image/*" multiple>
      <p class="msg">최대 5장. 소비기한 표시 부분이 보이는 사진을 포함해 주십시오.</p>
      <div id="thumbs"></div>
      <div class="bar"><button class="primary" id="run">검증</button></div>
      <p class="msg" id="msg"></p>
    </section>
    <section class="card verdict" id="result" hidden>
      <h2 id="title"></h2>
      <p class="phase" id="reason"></p>
      <p class="msg" id="detail"></p>
      <ul class="evidence" id="photos"></ul>
    </section>
  </main>
  <div id="modal" class="modal" hidden><div class="card"><p id="modalText"></p><button id="modalClose" class="primary">확인</button></div></div>
  <script type="module" src="verify.js?v=1790837879"></script>
</body>
</html>
