<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>소비기한 입고 검수</title>
  <link rel="stylesheet" href="style.css?v=1790837879">
</head>
<body>
  <header>
    <h1>소비기한 입고 검수</h1>
    <nav><a href="/">스캔</a><a href="stock.html">재고와 할인 대상</a><a href="verify.html">기한 검증</a></nav>
  </header>
  <main>
    <section>
      <button class="primary big" id="start">스캔 시작</button>
      <div class="camwrap"><video id="video" playsinline muted></video><div class="chips"><span class="chip" id="chipBarcode">바코드 찾는 중</span><span class="chip" id="chipDate">소비기한 찾는 중</span></div><div class="flash" id="flash" hidden></div></div>
      <div class="bar">
        <span class="phase" id="phase">스캔 시작을 눌러 주세요</span>
      </div>
      <ul id="recent"></ul>
      <div class="bar">
        <button id="shoot">지금 판독</button>
        <button id="confirm">확인 화면 열기</button>
        <button id="rebase">배경 다시 잡기</button>
      </div>
      <p class="msg" id="msg">상품을 카메라 앞에서 천천히 돌리면 바코드와 소비기한을 찾아 삑 소리와 함께 저장합니다. 의약품 2D 바코드는 유효기한까지 바코드에서 읽습니다.</p>
      <canvas id="small" width="64" height="48" hidden></canvas>
      <canvas id="full" hidden></canvas>
    </section>
    <aside>
      <div class="card" id="form" hidden>
        <h2>판독 결과 <span class="badge" id="badge"></span></h2>
        <label>바코드</label><input id="barcode" inputmode="numeric">
        <div class="bar"><button id="rescan">바코드 다시 읽기</button><button id="find">상품 찾기</button></div>
        <label>상품명</label><input id="pname">
        <label>소비기한 (연, 월, 일. 못 읽은 칸은 비워 둠)</label>
        <div class="date">
          <input class="datepart" id="year" maxlength="4" inputmode="numeric" placeholder="YYYY">
          <input class="datepart" id="month" maxlength="2" inputmode="numeric" placeholder="MM">
          <input class="datepart" id="day" maxlength="2" inputmode="numeric" placeholder="DD">
        </div>
        <ul class="evidence" id="evidence"></ul>
        <div class="bar"><button class="primary" id="save">저장</button><button id="skip">버리기</button></div>
      </div>
      <section id="manual" class="card" style="margin-top:16px">
        <h2>수기 입력 (비교 측정용)</h2>
        <p class="msg">상품을 집어 든 순간 "시작"을 누르고, 눈으로 읽어 입력한 뒤 저장합니다.</p>
        <div class="bar"><button id="mstart">시작</button><span id="mtimer" class="phase"></span></div>
        <div id="mfields" hidden>
          <label>바코드 숫자</label><input id="mbarcode" inputmode="numeric">
          <label>상품명</label><input id="mpname">
          <label>소비기한</label>
          <div class="date">
            <input id="myear" maxlength="4" inputmode="numeric" placeholder="YYYY">
            <input id="mmonth" maxlength="2" inputmode="numeric" placeholder="MM">
            <input id="mday" maxlength="2" inputmode="numeric" placeholder="DD">
          </div>
          <div class="bar"><button class="primary" id="msave">저장</button></div>
        </div>
        <p class="msg" id="mmsg"></p>
      </section>
    </aside>
  </main>
  <script src="vendor/zxing-browser.min.js"></script>
  <script type="module" src="scan.js?v=1790837879"></script>
  <script type="module" src="manual.js?v=1790837879"></script>
</body>
</html>
